# Herdr configuration — install to ~/.config/herdr/config.toml via
# script/bootstrap-shell. Shared by every machine that runs Herdr (laptop and
# mini both). For a machine-specific override, point HERDR_CONFIG_PATH at a
# different file rather than editing this one.
#
# Reload without restarting: herdr server reload-config
# See all available settings: herdr --default-config

# Both machines are past first-run onboarding. Herdr shows the onboarding flow
# when this is true *or missing*, so it has to be stated explicitly here — the
# key it wrote into its own config is lost once this file takes over.
onboarding = false

[terminal]
# New panes, tabs, and workspaces start in $HOME instead of inheriting the source cwd.
new_cwd = "home"

[keys]
# ctrl+a, not Herdr's default ctrl+b: matches the old tmux config's muscle
# memory, and sidesteps the never-root-caused issue where ctrl+b stopped
# reaching the terminal on one machine (documented in ~/.dotfiles/README.md
# history). prefix+a sends a literal ctrl+a through to readline.
prefix = "ctrl+a"

# Direct (no-prefix) bindings for the things hit constantly. ctrl+letter is
# what Herdr documents as most reliable across terminals — cmd never reaches
# a TUI at all, and alt needs iTerm's Left Option set to "Esc+".
next_tab = "ctrl+alt+n"
previous_tab = "ctrl+alt+p"

# Workspaces are the per-project unit here (one session, many workspaces),
# so give them prefix-free cycling too.
next_workspace = "ctrl+alt+right"
previous_workspace = "ctrl+alt+left"

# Splits and pane navigation stay on the prefix — vim-shaped, same as tmux,
# and not worth burning scarce direct ctrl chords on. Herdr's own defaults,
# restated here only because the vertical/horizontal names are ambiguous —
# Herdr's own pane menu calls these "Split right" and "Split down" — and
# zsh/motd.zsh advertises them by outcome, so the mapping needs to be written
# down somewhere we own. Confirmed by hand 2026-09-04, not inferred.
split_vertical = "prefix+v"    # new pane to the right
split_horizontal = "prefix+minus" # new pane below

[keys.indexed]
# Prefix-free number switching — the closest analogue to iTerm's cmd+1..9,
# which a TUI can never receive.
tabs = "ctrl"            # ctrl+1..9       -> tabs
workspaces = "ctrl+shift" # ctrl+shift+1..9 -> workspaces

[ui]
show_agent_labels_on_pane_borders = false

# Workspaces are the per-project unit, so prompt for a name on create rather
# than generating one — an unnamed workspace is useless in the picker.
prompt_new_workspace_name = true

# With many agents across workspaces, surface who needs attention first and
# make blocked/working/done readable without relying on color alone.
agent_panel_sort = "priority"
status_indicators = "symbols"

# Background agents finish or block while you're in another workspace —
# OS notifications so you notice without watching the sidebar.
[ui.toast]
delivery = "system"

[theme]
name = "solarized"
auto_switch = false
