[tools]
"github:gastownhall/beads" = "latest"
gitleaks = "8.30.1"
go = "latest"
osv-scanner = "2.6.0"
"pipx:hermes-agent" = { version = "0.19.0", extras = "all" }
# npm CLIs live here, not in `npm i -g`. Omarchy floats node to latest, and a
# global installed under one node version vanishes from the shims at the next
# bump ("supabase is not provided by the active node@26.13.0", readerful #1739).
# The npm: backend gives each tool its own install dir that survives node bumps.
# supabase is pinned: Readerful's per-worktree stack needs CLI v3 (#1726).
"npm:supabase" = "3.0.0"
"npm:agent-browser" = "0.38.1"
"npm:obsidian-headless" = { version = "0.0.14", allow_builds = "better-sqlite3" }

[settings.upgrade]
