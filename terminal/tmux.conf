# tmux config for the mini — install to ~/.tmux.conf via script/bootstrap-mini

set -g mouse on
set -g default-terminal "screen-256color"
setw -g mode-keys vi

set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

set -g display-time 4000
set -g display-panes-time 800

# Status line: session name, window:pane, clock
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[fg=green]#S #[fg=yellow]#I:#P "
set -g status-right "#[fg=cyan]%H:%M %d-%b"
set -g window-status-current-style "fg=white,bg=blue"

# Prefix stays default (C-b)
bind-key s choose-tree -Zs
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -n C-Left previous-window
bind-key -n C-Right next-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key N command-prompt -p "New session name:" "new-session -d -s '%%'"
bind-key K confirm-before -p "Kill session #S? (y/n)" kill-session

# Survive mini reboots/disconnects
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
