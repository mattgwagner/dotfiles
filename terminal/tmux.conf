# tmux config for the mini — install to ~/.tmux.conf via script/bootstrap-mini

set -g mouse on
set -g default-terminal "screen-256color"
setw -g mode-keys vi

set -g history-limit 100000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g allow-rename off

set -g display-time 4000
set -g display-panes-time 800

# Status line: session name, window:pane, clock
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[fg=green]#S #[fg=yellow]#I:#P "
set -g status-right "#[fg=cyan]%H:%M %d-%b"
set -g window-status-current-style "fg=white,bg=blue"

# Prefix: C-a (C-b wasn't reaching tmux — testing whether Control itself
# is the problem, or just that specific combo)
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

bind-key s choose-tree -Zs
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Vim-style pane movement (repeatable — hold prefix, tap h/j/k/l)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

bind-key -n C-Left previous-window
bind-key -n C-Right next-window

# Resize panes with Alt + arrows, no prefix
# (requires iTerm profile: Option key = "Esc+", else Alt sends literal chars)
bind-key -n M-Left  resize-pane -L 5
bind-key -n M-Right resize-pane -R 5
bind-key -n M-Up    resize-pane -U 3
bind-key -n M-Down  resize-pane -D 3

# Splits that inherit the current pane's working directory
unbind '"'
unbind %
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key N command-prompt -p "New session name:" "new-session -d -s '%%'"
bind-key K confirm-before -p "Kill session #S? (y/n)" kill-session

# Survive mini reboots/disconnects
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
